# =============================================================================
# Sistema de Gestión de Logs de Estaciones Meteorológicas
# Docker Compose - Orquestación de todos los servicios
# =============================================================================

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  postgres_data:
    name: weather_postgres_data
  rabbitmq_data:
    name: weather_rabbitmq_data
  rabbitmq_logs:
    name: weather_rabbitmq_logs
  prometheus_data:
    name: weather_prometheus_data
  grafana_data:
    name: weather_grafana_data

# =============================================================================
# Red interna
# =============================================================================
networks:
  weather_net:
    name: weather_station_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Servicios
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # 1. Base de datos PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       weather_db
      POSTGRES_USER:     weather_user
      POSTGRES_PASSWORD: weather_password
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - weather_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 2. Broker de mensajería RabbitMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: weather_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
      RABBITMQ_DEFAULT_VHOST: /
      # Habilitar plugin de métricas para Prometheus
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_prometheus return_per_object_metrics true
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
      # Configuración inicial de exchanges/queues/bindings
      # - ./monitoring/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus metrics
    networks:
      - weather_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 3. Consumidor de mensajes (puede escalarse horizontalmente)
  # ---------------------------------------------------------------------------
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: weather_consumer_1
    restart: unless-stopped
    environment:
      RABBITMQ_HOST:    rabbitmq
      RABBITMQ_PORT:    "5672"
      RABBITMQ_USER:    admin
      RABBITMQ_PASS:    admin_password
      RABBITMQ_VHOST:   /
      EXCHANGE_NAME:    weather.exchange
      QUEUE_NAME:       weather.readings.queue
      ROUTING_KEY:      weather.readings
      PREFETCH_COUNT:   "1"
      PG_HOST:          postgres
      PG_PORT:          "5432"
      PG_DB:            weather_db
      PG_USER:          weather_user
      PG_PASS:          weather_password
      PG_MIN_CONN:      "1"
      PG_MAX_CONN:      "5"
      MAX_RETRIES:      "10"
      RETRY_DELAY:      "5"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - weather_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 4. Productor de datos (simulador de estaciones)
  # ---------------------------------------------------------------------------
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: weather_producer_1
    restart: unless-stopped
    environment:
      RABBITMQ_HOST:     rabbitmq
      RABBITMQ_PORT:     "5672"
      RABBITMQ_USER:     admin
      RABBITMQ_PASS:     admin_password
      RABBITMQ_VHOST:    /
      EXCHANGE_NAME:     weather.exchange
      ROUTING_KEY:       weather.readings
      PUBLISH_INTERVAL:  "3"     # segundos entre publicaciones
      STATIONS_PER_BATCH: "3"    # estaciones por ciclo
      MAX_RETRIES:       "10"
      RETRY_DELAY:       "5"
      HOSTNAME:          producer-1
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - weather_net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 5. Prometheus - Monitoreo de métricas
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: weather_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - weather_net
    depends_on:
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 6. Grafana - Dashboards de visualización
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: weather_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_password
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         http://localhost:3000
      GF_INSTALL_PLUGINS:         grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - weather_net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 7. PostgreSQL Exporter para Prometheus
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: weather_pg_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://weather_user:weather_password@postgres:5432/weather_db?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - weather_net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
