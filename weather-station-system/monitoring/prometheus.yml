# =============================================================================
# Configuración de Prometheus para el Sistema Meteorológico
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    monitor: 'weather-station-monitor'
    environment: 'production'

# Reglas de alertas
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# Configuración de Alertmanager (opcional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Métricas del propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas de RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Métricas de PostgreSQL (via postgres_exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Métricas del sistema (node_exporter si se agrega)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
